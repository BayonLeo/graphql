<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="app.js"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="#">
    <title>Zone01 Dashboard</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <svg viewBox="0 0 100 100" width="80" height="80">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#4fc3f7" stroke-width="8"/>
                <path d="M30,30 L70,30 L70,70 L30,70 Z" fill="none" stroke="#4fc3f7" stroke-width="5"/>
                <path d="M40,40 L60,40 L60,60 L40,60 Z" fill="none" stroke="#4fc3f7" stroke-width="3"/>
            </svg>
            <h1>Zone01</h1>
        </div>

        <div class="login-form">
            <div class="input-group">
                <input type="text" id="username" required>
                <label for="username">Username</label>
                <div class="underline"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" required>
                <label for="password">Password</label>
                <div class="underline"></div>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="button" id="submitButton" class="glow-button">
                <span>Log In</span>
                <div class="glow"></div>
            </button>
        </div>
    </div>

    <div id="allContent" class="dashboard-container"></div>
</body>
</html>
